    <rect x="0" y="0" width="860" height="34" rx="4" fill="#FFE600" stroke="#111111" stroke-width="2" />
    <text x="16" y="22" class="mono bold" font-size="12" fill="#111111" letter-spacing="1.5">⚡ SYSTEM_ARCHITECTURE // TECH STACK MATRIX</text>
    <text x="844" y="22" class="mono bold" font-size="11" fill="#111111" text-anchor="end" letter-spacing="1">[CORE_SKILLS: COMPILED]</text>
