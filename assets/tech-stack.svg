<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 370" width="100%" height="100%">
  <defs>
    <style>
      .mono { font-family: 'SF Mono', 'JetBrains Mono', 'Fira Code', Menlo, Consolas, monospace; }
      .sans { font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif; }
      .bold { font-weight: 800; }
      .medium { font-weight: 600; }
      .tag {
        font-family: 'SF Mono', 'JetBrains Mono', Menlo, Consolas, monospace;
        font-size: 11px;
        font-weight: 700;
        fill: #111111;
      }
    </style>
  </defs>

  <!-- Background Base Canvas -->
  <rect x="0" y="0" width="900" height="370" rx="8" fill="#F4EFEA" stroke="#111111" stroke-width="2.5" />

  <!-- Top Section Title Bar -->
  <g transform="translate(20, 16)">
