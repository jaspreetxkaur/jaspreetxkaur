    <!-- Tags Row 1 -->
    <g transform="translate(12, 42)">
      <!-- Java -->
      <rect x="0" y="0" width="54" height="24" rx="4" fill="#FAF6EE" stroke="#111111" stroke-width="1.5" />
      <text x="27" y="16" class="tag" text-anchor="middle">Java</text>
      <!-- Python -->
      <g transform="translate(62, 0)">
