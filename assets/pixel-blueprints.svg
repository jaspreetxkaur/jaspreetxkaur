<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 540" width="100%" height="100%">
  <defs>
    <style>
      .term-green {
        font-family: 'Press Start 2P', 'Courier New', 'SF Mono', monospace;
        font-size: 11px;
        font-weight: bold;
        fill: #39d353;
        letter-spacing: 1.2px;
      }
      .prj-title {
        font-family: 'Press Start 2P', 'Courier New', 'SF Mono', monospace;
        font-size: 11px;
        font-weight: bold;
        fill: #f0f6fc;
      }
      .prj-meta {
        font-family: 'SF Mono', 'JetBrains Mono', Menlo, Consolas, monospace;
        font-size: 9.5px;
        fill: #8b949e;
      }
      .node-txt {
        font-family: 'SF Mono', 'JetBrains Mono', Menlo, Consolas, monospace;
        font-size: 8.5px;
        font-weight: bold;
        fill: #f0f6fc;
      }
      .node-sub {
        font-family: 'SF Mono', 'JetBrains Mono', Menlo, Consolas, monospace;
        font-size: 7.5px;
        fill: #8b949e;
      }
      .badge {
        font-family: 'SF Mono', 'JetBrains Mono', Menlo, Consolas, monospace;
        font-size: 8.5px;
        font-weight: bold;
      }
      @keyframes flow-pulse {
        0%, 100% { opacity: 0.6; stroke-dashoffset: 0; }
        50% { opacity: 1.0; stroke-dashoffset: -10; }
      }
      .flow-arrow {
        stroke-dasharray: 4, 3;
        animation: flow-pulse 2s linear infinite;
      }
    </style>
  </defs>

  <!-- Container Box -->
  <rect x="0" y="0" width="880" height="540" rx="8" fill="#161b22" stroke="#30363d" stroke-width="1.5" />

  <!-- Terminal Header -->
  <g transform="translate(28, 22)">
    <text x="0" y="0" class="term-green">&gt; REPOSITORY_SCHEMATICS.sys // ARCHITECTURE BLUEPRINTS</text>
    <rect x="460" y="-12" width="180" height="16" rx="3" fill="#21262d" />
    <text x="470" y="0" font-family="'SF Mono', monospace" font-size="9" font-weight="bold" fill="#58a6ff">● VERIFIED SYSTEM FLOWS</text>
  </g>

  <!-- ================= CARD 1: UNILLM BLUEPRINT ================= -->
  <g transform="translate(28, 42)">
