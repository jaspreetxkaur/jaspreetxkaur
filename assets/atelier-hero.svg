<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 500" width="100%" height="100%">
  <defs>
    <style>
      .serif { font-family: 'Playfair Display', Georgia, 'Times New Roman', serif; }
      .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
      .mono { font-family: 'SF Mono', 'JetBrains Mono', 'Fira Code', Menlo, Consolas, monospace; }
      
      @keyframes float-sparkle {
        0%, 100% { transform: translateY(0px) scale(0.9); opacity: 0.7; }
        50% { transform: translateY(-4px) scale(1.15); opacity: 1.0; }
      }
      @keyframes soft-lamp-glow {
        0%, 100% { opacity: 0.25; }
        50% { opacity: 0.45; }
      }
      @keyframes moon-breathe {
        0%, 100% { transform: scale(1); }
        50% { transform: scale(1.05); }
      }
      .sparkle-anim-1 { animation: float-sparkle 3.5s ease-in-out infinite; transform-origin: center; }
      .sparkle-anim-2 { animation: float-sparkle 4.2s ease-in-out infinite 1.2s; transform-origin: center; }
      .glow-lamp { animation: soft-lamp-glow 4s ease-in-out infinite; }
    </style>
    <linearGradient id="twilight-sky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1A1829" />
      <stop offset="60%" stop-color="#3B2D4A" />
      <stop offset="100%" stop-color="#6E4555" />
    </linearGradient>
    <linearGradient id="rose-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#E8A0BF" />
      <stop offset="100%" stop-color="#F7C8DA" />
    </linearGradient>
    <linearGradient id="warm-wood" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#D9B58C" />
      <stop offset="100%" stop-color="#9C7753" />
    </linearGradient>
    <pattern id="desktop-grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="0.8" fill="#E8A0BF" opacity="0.25" />
    </pattern>
  </defs>

  <!-- Desktop Base Frame (Midnight Plum) -->
  <rect x="0" y="0" width="920" height="500" rx="12" fill="#282438" stroke="#E8A0BF" stroke-width="2" />
  
  <!-- Subtle Desktop Wallpaper Pattern -->
  <rect x="2" y="32" width="916" height="466" fill="url(#desktop-grid)" rx="0" />

  <!-- ================= TOP VINTAGE SYSTEM BAR ================= -->
  <rect x="0" y="0" width="920" height="32" rx="12" fill="#1E1A2B" />
  <rect x="0" y="20" width="920" height="12" fill="#1E1A2B" />
  <line x1="0" y1="32" x2="920" y2="32" stroke="#E8A0BF" stroke-width="1.2" opacity="0.6" />

  <!-- System Bar Left Menu -->
  <g transform="translate(18, 20)">
    <!-- Tiny Pixel Flower / Atelier Icon -->
    <circle cx="4" cy="0" r="4.5" fill="#F7C8DA" />
    <circle cx="4" cy="0" r="2" fill="#E8A0BF" />
    <text x="18" y="4" class="serif" font-size="12.5" font-weight="700" fill="#FAF6EE" letter-spacing="0.5">The Digital Atelier</text>
    <text x="145" y="4" class="sans" font-size="11" fill="#F7C8DA" opacity="0.85">File</text>
    <text x="180" y="4" class="sans" font-size="11" fill="#F7C8DA" opacity="0.85">Workspace</text>
    <text x="255" y="4" class="sans" font-size="11" fill="#F7C8DA" opacity="0.85">Window</text>
  </g>

  <!-- System Bar Right Telemetry -->
  <g transform="translate(898, 20)">
    <text x="0" y="4" class="mono" font-size="10.5" fill="#FAF6EE" text-anchor="end" letter-spacing="0.5">Rajpura, Punjab · AI/ML Atelier · Chitkara '28</text>
  </g>

  <!-- ================= WINDOW 1: ATELIER WORKSPACE & INTRODUCTION ================= -->
  <g transform="translate(24, 50)">
    <!-- Window Drop Shadow -->
    <rect x="6" y="6" width="550" height="424" rx="8" fill="#1E1A2B" opacity="0.8" />
    <!-- Window Container -->
    <rect x="0" y="0" width="550" height="424" rx="8" fill="#FDFBF7" stroke="#E8A0BF" stroke-width="1.8" />

    <!-- Window Title Bar -->
    <path d="M 0 8 C 0 3.58 3.58 0 8 0 L 542 0 C 546.42 0 550 3.58 550 8 L 550 30 L 0 30 Z" fill="#E8A0BF" />
    <circle cx="16" cy="15" r="4" fill="#FAF6EE" />
    <circle cx="28" cy="15" r="4" fill="#F7C8DA" />
    <circle cx="40" cy="15" r="4" fill="#B9C9BB" />
    <text x="58" y="19" class="mono" font-size="11" font-weight="700" fill="#282438" letter-spacing="0.5">atelier://workspace/jaspreet-kaur.env</text>
    
    <!-- Top Half: Cozy Pixel Room Illustration Canvas (Height 210) -->
    <g transform="translate(14, 42)">
      <!-- Room Base Canvas -->
      <rect x="0" y="0" width="522" height="210" rx="6" fill="#F4EDE4" stroke="#F7C8DA" stroke-width="1" />
      
      <!-- Room Wallpaper Striping -->
      <line x1="0" y1="165" x2="522" y2="165" stroke="#D9B58C" stroke-width="1.5" />
      <!-- Floor (Warm Parquet) -->
      <rect x="0" y="165" width="522" height="45" rx="0" fill="#E8DEC8" />
      <line x1="80" y1="165" x2="60" y2="210" stroke="#D3C3A8" stroke-width="1" />
      <line x1="180" y1="165" x2="160" y2="210" stroke="#D3C3A8" stroke-width="1" />
      <line x1="280" y1="165" x2="260" y2="210" stroke="#D3C3A8" stroke-width="1" />
      <line x1="380" y1="165" x2="360" y2="210" stroke="#D3C3A8" stroke-width="1" />
      <line x1="480" y1="165" x2="460" y2="210" stroke="#D3C3A8" stroke-width="1" />

      <!-- Left Window (Arch Outdoor Scenery) -->
      <g transform="translate(24, 16)">
        <!-- Window Frame Exterior -->
        <rect x="0" y="0" width="130" height="135" rx="65 65 4 4" fill="url(#twilight-sky)" stroke="#E8A0BF" stroke-width="2.5" />
        <!-- Window Panes Cross -->
        <line x1="65" y1="0" x2="65" y2="135" stroke="#E8A0BF" stroke-width="2" />
        <line x1="0" y1="65" x2="130" y2="65" stroke="#E8A0BF" stroke-width="2" />
        
        <!-- Scenery: Crescent Moon & Stars -->
        <path d="M 94 28 A 12 12 0 1 0 106 40 A 10 10 0 0 1 94 28 Z" fill="#D9B58C" opacity="0.9" />
        <circle cx="32" cy="38" r="1.5" fill="#FAF6EE" />
        <circle cx="50" cy="24" r="1.2" fill="#F7C8DA" />
        <circle cx="82" cy="50" r="1.2" fill="#FAF6EE" />
        <!-- Distant Pine Trees Silhouette -->
        <polygon points="15,135 25,105 35,135" fill="#141120" />
        <polygon points="30,135 42,98 54,135" fill="#141120" />
        <polygon points="70,135 84,102 98,135" fill="#141120" />
        <polygon points="95,135 108,110 120,135" fill="#141120" />
      </g>

      <!-- Center: Vintage Desk & Computer Monitor -->
      <g transform="translate(180, 52)">
        <!-- Wall Clock -->
        <circle cx="150" cy="18" r="14" fill="#FAF6EE" stroke="#E8A0BF" stroke-width="1.8" />
        <line x1="150" y1="18" x2="150" y2="10" stroke="#282438" stroke-width="1.5" />
        <line x1="150" y1="18" x2="157" y2="18" stroke="#282438" stroke-width="1.5" />
        <circle cx="150" cy="18" r="1.5" fill="#E8A0BF" />

        <!-- Vintage Wooden Bookshelf -->
        <rect x="200" y="14" width="110" height="8" rx="2" fill="url(#warm-wood)" stroke="#805B3A" stroke-width="1" />
        <!-- Books with Colored Spines -->
        <rect x="208" y="-12" width="12" height="26" rx="1.5" fill="#B9C9BB" stroke="#8E9E90" stroke-width="0.8" />
        <rect x="222" y="-16" width="14" height="30" rx="1.5" fill="#E8A0BF" stroke="#C77D9E" stroke-width="0.8" />
        <rect x="238" y="-10" width="10" height="24" rx="1.5" fill="#C5B4F2" stroke="#9884C7" stroke-width="0.8" />
        <rect x="250" y="-14" width="13" height="28" rx="1.5" fill="#D9B58C" stroke="#B89265" stroke-width="0.8" />
        <rect x="265" y="-8" width="15" height="22" rx="1.5" fill="#282438" stroke="#E8A0BF" stroke-width="0.8" />

        <!-- Warm Desk Lamp -->
        <path d="M 40 115 L 50 65 L 68 65" fill="none" stroke="#D9B58C" stroke-width="3" stroke-linecap="round" />
        <polygon points="56,60 82,60 90,74 48,74" fill="#E8A0BF" stroke="#282438" stroke-width="1" />
        <!-- Soft Lamp Light Cone -->
        <polygon points="52,74 86,74 125,125 15,125" fill="#D9B58C" opacity="0.15" class="glow-lamp" />

        <!-- Vintage Computer Monitor -->
        <!-- Monitor Stand Base -->
        <rect x="130" y="118" width="50" height="6" rx="2" fill="#D3C7B5" stroke="#9E9280" stroke-width="1" />
        <rect x="150" y="110" width="10" height="8" fill="#BDB09E" />
        <!-- Bezel -->
        <rect x="100" y="45" width="110" height="66" rx="6" fill="#E8DEC8" stroke="#A89B87" stroke-width="1.8" />
        <!-- Monitor Screen (Glowing Midnight Plum) -->
        <rect x="108" y="52" width="94" height="52" rx="3" fill="#282438" />
        <!-- Code Lines on Screen -->
        <line x1="114" y1="60" x2="155" y2="60" stroke="#C5B4F2" stroke-width="1.6" />
        <line x1="114" y1="66" x2="188" y2="66" stroke="#F7C8DA" stroke-width="1.6" />
        <line x1="120" y1="72" x2="175" y2="72" stroke="#B9C9BB" stroke-width="1.6" />
        <line x1="120" y1="78" x2="160" y2="78" stroke="#D9B58C" stroke-width="1.6" />
        <line x1="114" y1="84" x2="145" y2="84" stroke="#FAF6EE" stroke-width="1.6" />
        <rect x="148" y="82" width="4" height="5" fill="#E8A0BF" />

        <!-- Wooden Desk Surface -->
        <rect x="0" y="118" width="330" height="14" rx="2" fill="url(#warm-wood)" stroke="#805B3A" stroke-width="1.2" />
        
        <!-- Potted Sage Plant on Desk -->
        <polygon points="290,118 314,118 310,102 294,102" fill="#C49B72" stroke="#805B3A" stroke-width="1" />
        <!-- Leaves -->
        <ellipse cx="298" cy="95" rx="7" ry="10" fill="#B9C9BB" transform="rotate(-20 298 95)" />
        <ellipse cx="308" cy="94" rx="7" ry="11" fill="#B9C9BB" transform="rotate(25 308 94)" />
        <ellipse cx="303" cy="88" rx="6" ry="10" fill="#B9C9BB" />
      </g>
    </g>

    <!-- Bottom Half: Editorial Introduction (Height 150) -->
    <g transform="translate(24, 270)">
      <!-- Status Badge -->
      <rect x="0" y="0" width="186" height="22" rx="11" fill="#E8A0BF" opacity="0.2" />
      <text x="10" y="15" class="mono" font-size="10" font-weight="700" fill="#282438" letter-spacing="1">✦ FULL STACK · AI/ML DEVELOPER</text>

      <!-- Prominent Name in Classy Serif -->
      <text x="0" y="52" class="serif" font-size="32" font-weight="800" fill="#282438" letter-spacing="-0.5">Jaspreet Kaur</text>
      
      <!-- Academic & Engineering Positioning -->
      <text x="0" y="74" class="sans" font-size="13" font-weight="600" fill="#E8A0BF">CSE (AI &amp; ML) · Chitkara University · Class of 2028 · CGPA 9.21</text>
      
      <!-- Supporting Statement -->
      <text x="0" y="98" class="sans" font-size="12" fill="#5A5266" letter-spacing="0.2">"Crafting intelligent applications, scalable backend systems, and thoughtful digital architectures."</text>
      
      <!-- Pills -->
      <g transform="translate(0, 114)">
        <rect x="0" y="0" width="94" height="20" rx="4" fill="#FAF6EE" stroke="#E8A0BF" stroke-width="1" />
        <text x="47" y="14" class="mono" font-size="9" font-weight="700" fill="#282438" text-anchor="middle">FULL STACK</text>

        <rect x="102" y="0" width="102" height="20" rx="4" fill="#FAF6EE" stroke="#E8A0BF" stroke-width="1" />
        <text x="153" y="14" class="mono" font-size="9" font-weight="700" fill="#282438" text-anchor="middle">AI/ML &amp; LLMS</text>

        <rect x="212" y="0" width="90" height="20" rx="4" fill="#FAF6EE" stroke="#E8A0BF" stroke-width="1" />
        <text x="257" y="14" class="mono" font-size="9" font-weight="700" fill="#282438" text-anchor="middle">BACKEND SYS</text>

        <rect x="310" y="0" width="110" height="20" rx="4" fill="#FAF6EE" stroke="#B9C9BB" stroke-width="1" />
        <text x="365" y="14" class="mono" font-size="9" font-weight="700" fill="#282438" text-anchor="middle">ACTIVE BUILDER ✦</text>
      </g>
    </g>
  </g>

  <!-- ================= WINDOW 2: ANIME PORTRAIT REVEAL WINDOW ================= -->
  <g transform="translate(596, 50)">
    <!-- Shadow -->
    <rect x="6" y="6" width="300" height="424" rx="8" fill="#1E1A2B" opacity="0.8" />
    <!-- Container -->
    <rect x="0" y="0" width="300" height="424" rx="8" fill="#FDFBF7" stroke="#E8A0BF" stroke-width="1.8" />

    <!-- Window Title Bar -->
    <path d="M 0 8 C 0 3.58 3.58 0 8 0 L 292 0 C 296.42 0 300 3.58 300 8 L 300 30 L 0 30 Z" fill="#E8A0BF" />
    <circle cx="16" cy="15" r="4" fill="#FAF6EE" />
    <circle cx="28" cy="15" r="4" fill="#F7C8DA" />
    <text x="44" y="19" class="mono" font-size="11" font-weight="700" fill="#282438" letter-spacing="0.5">atelier://portrait.sys</text>

    <!-- Portrait Container (Inner Frame) -->
    <g transform="translate(18, 44)">
      <!-- Soft Blush Frame -->
      <rect x="0" y="0" width="264" height="280" rx="6" fill="#FAF6EE" stroke="#F7C8DA" stroke-width="2" />
      
      <!-- Embedded Anime Avatar Image -->
      <image href="./atelier-avatar-reveal.gif" x="6" y="6" width="252" height="268" preserveAspectRatio="xMidYMid slice" />
      
      <!-- Delicate Sparkles Floating Around Avatar Frame -->
      <g class="sparkle-anim-1">
        <!-- Top Left Sparkle -->
        <polygon points="20,12 23,20 31,23 23,26 20,34 17,26 9,23 17,20" fill="#D9B58C" />
      </g>
      <g class="sparkle-anim-2">
        <!-- Bottom Right Sparkle -->
        <polygon points="244,248 247,254 253,257 247,260 244,266 241,260 235,257 241,254" fill="#E8A0BF" />
      </g>
    </g>

    <!-- Bio / Info Below Avatar in Portrait Window -->
    <g transform="translate(18, 338)">
      <text x="132" y="14" class="serif" font-size="14" font-weight="700" fill="#282438" text-anchor="middle">Jaspreet Kaur</text>
      <text x="132" y="32" class="sans" font-size="11" fill="#E8A0BF" font-weight="600" text-anchor="middle">AI &amp; Machine Learning Engineer</text>
      <text x="132" y="52" class="mono" font-size="9.5" fill="#6B627A" text-anchor="middle">Chitkara University · Rajpura, Punjab</text>
      <line x1="30" y1="66" x2="234" y2="66" stroke="#F7C8DA" stroke-width="1" />
      <text x="132" y="78" class="mono" font-size="9" font-weight="600" fill="#B9C9BB" text-anchor="middle">✦ SYSTEM STATUS: CRAFTING ✦</text>
    </g>
  </g>
</svg>