<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 136" width="100%" height="100%">
  <defs>
    <style>
      .term-green {
        font-family: 'Press Start 2P', 'Courier New', 'SF Mono', monospace;
        font-size: 11px;
        font-weight: bold;
        fill: #39d353;
        letter-spacing: 1.5px;
      }
      .conn-title {
        font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        font-size: 20px;
        font-weight: 800;
        fill: #ffffff;
      }
      .conn-sub {
        font-family: 'SF Mono', 'JetBrains Mono', Menlo, Consolas, monospace;
        font-size: 11px;
        fill: #8b949e;
      }
      .key-text {
        font-family: 'SF Mono', 'JetBrains Mono', Menlo, Consolas, monospace;
        font-size: 10px;
        font-weight: bold;
        fill: #f0f6fc;
      }
    </style>
  </defs>

  <rect x="0" y="0" width="880" height="136" rx="8" fill="#161b22" stroke="#30363d" stroke-width="1.5" />

  <g transform="translate(32, 28)">
    <text x="0" y="0" class="term-green">&gt; CONNECT // REACH OUT &amp; COLLABORATE</text>
    <text x="0" y="32" class="conn-title">Let's build something intelligent.</text>
    <text x="0" y="54" class="conn-sub">Always open to discussions on AI/ML systems, backend architectures, and engineering projects.</text>
  </g>

  <!-- Interactive Terminal Buttons -->
  <g transform="translate(32, 94)">
    <rect x="0" y="0" width="180" height="26" rx="4" fill="#0d1117" stroke="#30363d" stroke-width="1.2" />
    <text x="90" y="17" class="key-text" text-anchor="middle">🌐 GitHub : @jaspreetxkaur</text>

    <rect x="194" y="0" width="220" height="26" rx="4" fill="#0d1117" stroke="#58a6ff" stroke-width="1.2" />
    <text x="304" y="17" class="key-text" fill="#58a6ff" text-anchor="middle">💼 LinkedIn : Jaspreet Kaur</text>

    <rect x="428" y="0" width="280" height="26" rx="4" fill="#0d1117" stroke="#39d353" stroke-width="1.2" />
    <text x="568" y="17" class="key-text" fill="#39d353" text-anchor="middle">✉️ Email : jaspreet2775.beai24@chitkara</text>
  </g>
</svg>
