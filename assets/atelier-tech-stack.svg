      <text x="14" y="24" class="mono" font-size="9" fill="#756C82">Pipelines, Document Store</text>

      <circle cx="4" cy="44" r="3" fill="#B9C9BB" />
      <text x="14" y="48" class="sans" font-size="12" font-weight="700" fill="#282438">PostgreSQL</text>
