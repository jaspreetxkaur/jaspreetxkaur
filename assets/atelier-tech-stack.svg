      <circle cx="4" cy="120" r="3" fill="#C5B4F2" />
      <text x="14" y="124" class="sans" font-size="12" font-weight="700" fill="#282438">LLM Architecture</text>
      <text x="14" y="138" class="mono" font-size="9" fill="#756C82">RAG, Azure AI, Prompting</text>
    </g>
