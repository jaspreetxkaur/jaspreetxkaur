      <text x="14" y="10" class="sans" font-size="12" font-weight="700" fill="#282438">Python</text>
      <text x="14" y="24" class="mono" font-size="9" fill="#756C82">NumPy, PyTorch, RAG</text>

      <circle cx="4" cy="44" r="3" fill="#B9C9BB" />
      <text x="14" y="48" class="sans" font-size="12" font-weight="700" fill="#282438">C++</text>
      <text x="14" y="62" class="mono" font-size="9" fill="#756C82">Algorithms, Optimization</text>

      <circle cx="4" cy="82" r="3" fill="#D9B58C" />
      <text x="14" y="86" class="sans" font-size="12" font-weight="700" fill="#282438">Java</text>
      <text x="14" y="100" class="mono" font-size="9" fill="#756C82">128+ DSA, OOP, Systems</text>

      <circle cx="4" cy="120" r="3" fill="#C5B4F2" />
      <text x="14" y="124" class="sans" font-size="12" font-weight="700" fill="#282438">JavaScript</text>
      <text x="14" y="138" class="mono" font-size="9" fill="#756C82">ES6+, React, Node.js</text>
    </g>
