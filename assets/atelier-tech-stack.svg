  <g transform="translate(648, 48)">
    <rect x="0" y="0" width="190" height="186" rx="6" fill="#FAF6EE" stroke="#F7C8DA" stroke-width="1.2" />
    <path d="M 0 6 C 0 2.68 2.68 0 6 0 L 184 0 C 187.31 0 190 2.68 190 6 L 190 26 L 0 26 Z" fill="#282438" />
    <text x="12" y="17" class="mono" font-size="10" font-weight="700" fill="#E8A0BF" letter-spacing="0.5">04 // DATA &amp; DEVOPS</text>

