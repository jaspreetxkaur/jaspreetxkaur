<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 260" width="100%" height="100%">
  <defs>
    <style>
      .serif { font-family: 'Playfair Display', Georgia, serif; }
      .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
      .mono { font-family: 'SF Mono', 'JetBrains Mono', 'Fira Code', Menlo, Consolas, monospace; }
    </style>
  </defs>

  <!-- Frame Shadow & Body -->
  <rect x="5" y="5" width="870" height="250" rx="10" fill="#1E1A2B" opacity="0.6" />
  <rect x="0" y="0" width="870" height="250" rx="10" fill="#FDFBF7" stroke="#E8A0BF" stroke-width="1.8" />

  <!-- Window Titlebar -->
  <path d="M 0 10 C 0 4.47 4.47 0 10 0 L 860 0 C 865.53 0 870 4.47 870 10 L 870 32 L 0 32 Z" fill="#E8A0BF" />
  <circle cx="16" cy="16" r="4.5" fill="#FAF6EE" />
  <circle cx="30" cy="16" r="4.5" fill="#F7C8DA" />
  <circle cx="44" cy="16" r="4.5" fill="#B9C9BB" />
  <text x="64" y="20" class="mono" font-size="11" font-weight="700" fill="#282438" letter-spacing="0.5">atelier://instruments/tech-stack.sys</text>
