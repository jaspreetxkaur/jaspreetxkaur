      <circle cx="4" cy="6" r="3" fill="#E8A0BF" />
      <text x="14" y="10" class="sans" font-size="12" font-weight="700" fill="#282438">PyTorch</text>
      <text x="14" y="24" class="mono" font-size="9" fill="#756C82">DNNs, KV-Cache Forecast</text>

