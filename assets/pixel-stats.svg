<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 88" width="100%" height="100%">
  <defs>
    <style>
      .pixel-num {
        font-family: 'Press Start 2P', 'Courier New', 'SF Mono', monospace;
        font-size: 20px;
        font-weight: bold;
        fill: #f0f6fc;
      }
      .pixel-label {
        font-family: 'Press Start 2P', 'Courier New', 'SF Mono', monospace;
        font-size: 8.5px;
        fill: #8b949e;
        letter-spacing: 1px;
      }
      .pixel-accent {
        font-family: 'SF Mono', 'JetBrains Mono', Menlo, Consolas, monospace;
        font-size: 10px;
        font-weight: bold;
        fill: #39d353;
      }
    </style>
  </defs>

  <rect x="0" y="0" width="880" height="88" rx="8" fill="#161b22" stroke="#30363d" stroke-width="1.5" />

  <!-- 4 Stat Columns with Visual Icons -->
  <!-- Col 1: 128+ DSA -->
  <g transform="translate(30, 20)">
    <text x="90" y="22" class="pixel-num" text-anchor="middle">128+</text>
    <text x="90" y="42" class="pixel-label" text-anchor="middle">DSA SOLVED</text>
    <text x="90" y="58" class="pixel-accent" text-anchor="middle" fill="#ff9f43">Trees · Graphs · DP</text>
  </g>

  <line x1="230" y1="16" x2="230" y2="72" stroke="#30363d" stroke-width="1.5" />

  <!-- Col 2: 8+ PROJECTS -->
  <g transform="translate(250, 20)">
    <text x="90" y="22" class="pixel-num" text-anchor="middle">8+</text>
    <text x="90" y="42" class="pixel-label" text-anchor="middle">ACTIVE REPOS</text>
    <text x="90" y="58" class="pixel-accent" text-anchor="middle" fill="#58a6ff">Full-Stack &amp; AI/ML</text>
  </g>

  <line x1="450" y1="16" x2="450" y2="72" stroke="#30363d" stroke-width="1.5" />

  <!-- Col 3: 3 CERTS -->
  <g transform="translate(470, 20)">
    <text x="90" y="22" class="pixel-num" text-anchor="middle">3</text>
    <text x="90" y="42" class="pixel-label" text-anchor="middle">CERTIFICATIONS</text>
    <text x="90" y="58" class="pixel-accent" text-anchor="middle" fill="#f1c40f">OCI &amp; Azure AZ/DP</text>
  </g>

  <line x1="670" y1="16" x2="670" y2="72" stroke="#30363d" stroke-width="1.5" />

  <!-- Col 4: 2028 COHORT -->
  <g transform="translate(690, 20)">
    <text x="80" y="22" class="pixel-num" text-anchor="middle">'28</text>
    <text x="80" y="42" class="pixel-label" text-anchor="middle">COHORT 2028</text>
    <text x="80" y="58" class="pixel-accent" text-anchor="middle" fill="#39d353">Chitkara AI &amp; ML</text>
  </g>
</svg>
