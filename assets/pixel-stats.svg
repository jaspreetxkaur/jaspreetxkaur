<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 84" width="100%" height="100%">
  <defs>
    <style>
      .pixel-num {
        font-family: 'Press Start 2P', 'Courier New', 'SF Mono', monospace;
        font-size: 22px;
        font-weight: bold;
        fill: #f0f6fc;
      }
      .pixel-label {
        font-family: 'Press Start 2P', 'Courier New', 'SF Mono', monospace;
        font-size: 9px;
        fill: #8b949e;
        letter-spacing: 1px;
      }
    </style>
  </defs>

  <!-- Container Box -->
  <rect x="0" y="0" width="880" height="84" rx="8" fill="#161b22" stroke="#30363d" stroke-width="1.5" />

  <!-- 4 Stat Columns -->
  <!-- Col 1: 128+ DSA -->
  <g transform="translate(60, 22)">
    <text x="50" y="24" class="pixel-num" text-anchor="middle">128+</text>
    <text x="50" y="44" class="pixel-label" text-anchor="middle">DSA SOLVED</text>
  </g>

  <!-- Divider 1 -->
  <line x1="220" y1="18" x2="220" y2="66" stroke="#30363d" stroke-width="1.5" />

  <!-- Col 2: 8+ PROJECTS -->
  <g transform="translate(280, 22)">
    <text x="50" y="24" class="pixel-num" text-anchor="middle">8+</text>
    <text x="50" y="44" class="pixel-label" text-anchor="middle">PROJECTS</text>
  </g>

  <!-- Divider 2 -->
  <line x1="440" y1="18" x2="440" y2="66" stroke="#30363d" stroke-width="1.5" />

  <!-- Col 3: 3 CERTS -->
  <g transform="translate(500, 22)">
    <text x="50" y="24" class="pixel-num" text-anchor="middle">3</text>
    <text x="50" y="44" class="pixel-label" text-anchor="middle">CERTIFICATIONS</text>
  </g>

  <!-- Divider 3 -->
  <line x1="660" y1="18" x2="660" y2="66" stroke="#30363d" stroke-width="1.5" />

  <!-- Col 4: 2028 COHORT -->
  <g transform="translate(720, 22)">
    <text x="50" y="24" class="pixel-num" text-anchor="middle">'28</text>
    <text x="50" y="44" class="pixel-label" text-anchor="middle">CHITKARA COHORT</text>
  </g>
</svg>
