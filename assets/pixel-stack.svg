<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 270" width="100%" height="100%">
  <defs>
    <style>
      .terminal-header {
        font-family: 'Press Start 2P', 'Courier New', 'SF Mono', monospace;
        font-size: 12px;
        font-weight: bold;
        fill: #39d353;
        letter-spacing: 1.5px;
      }
      .cat-title {
        font-family: 'Press Start 2P', 'Courier New', 'SF Mono', monospace;
        font-size: 9px;
        font-weight: bold;
        fill: #58a6ff;
        letter-spacing: 0.8px;
      }
      .tag {
        font-family: 'SF Mono', 'JetBrains Mono', Menlo, Consolas, monospace;
        font-size: 11px;
        font-weight: 500;
        fill: #c9d1d9;
      }
      .subtag {
        font-family: 'SF Mono', 'JetBrains Mono', Menlo, Consolas, monospace;
        font-size: 9.5px;
        fill: #8b949e;
      }
      .chip {
        font-family: 'SF Mono', 'JetBrains Mono', Menlo, Consolas, monospace;
        font-size: 9px;
        font-weight: bold;
        fill: #39d353;
      }
    </style>
  </defs>

  <!-- Container Box -->
  <rect x="0" y="0" width="880" height="270" rx="8" fill="#161b22" stroke="#30363d" stroke-width="1.5" />

  <!-- Terminal Header -->
  <g transform="translate(28, 24)">
    <text x="0" y="0" class="terminal-header">&gt; TECH STACK &amp; CORE ARSENAL</text>
    <rect x="360" y="-12" width="160" height="16" rx="3" fill="#21262d" />
    <text x="370" y="0" class="chip">● FULL STACK + AI/ML</text>
  </g>

  <!-- Row 1: Languages, Frontend, Backend -->
  <g transform="translate(28, 48)">
    <!-- 01 // Languages -->
    <g transform="translate(0, 0)">
      <rect x="0" y="0" width="260" height="92" rx="6" fill="#0d1117" stroke="#30363d" stroke-width="1.2" />
      <text x="14" y="20" class="cat-title">01 // LANGUAGES</text>
      <text x="14" y="44" class="tag">Java · Python · C++</text>
      <text x="14" y="62" class="tag">JavaScript · SQL</text>
      <text x="14" y="78" class="subtag">OOP · Algorithms · Data Pipelines</text>
    </g>

    <!-- 02 // Frontend -->
    <g transform="translate(282, 0)">
      <rect x="0" y="0" width="260" height="92" rx="6" fill="#0d1117" stroke="#30363d" stroke-width="1.2" />
      <text x="14" y="20" class="cat-title">02 // FRONTEND</text>
      <text x="14" y="44" class="tag">React · JavaScript (ES6+)</text>
      <text x="14" y="62" class="tag">HTML5 · CSS3</text>
      <text x="14" y="78" class="subtag">Component UI · Responsive Design</text>
    </g>

    <!-- 03 // Backend -->
    <g transform="translate(564, 0)">
      <rect x="0" y="0" width="260" height="92" rx="6" fill="#0d1117" stroke="#30363d" stroke-width="1.2" />
      <text x="14" y="20" class="cat-title">03 // BACKEND &amp; APIS</text>
      <text x="14" y="44" class="tag">Node.js · Express · FastAPI</text>
      <text x="14" y="62" class="tag">Django · REST · Socket.IO</text>
      <text x="14" y="78" class="subtag">JWT Auth · Rate Limiting · Streaming</text>
    </g>
  </g>

  <!-- Row 2: Databases, AI/ML, Cloud & DevOps -->
  <g transform="translate(28, 154)">
    <!-- 04 // Databases -->
    <g transform="translate(0, 0)">
      <rect x="0" y="0" width="260" height="92" rx="6" fill="#0d1117" stroke="#30363d" stroke-width="1.2" />
      <text x="14" y="20" class="cat-title">04 // DATABASES</text>
      <text x="14" y="44" class="tag">MongoDB · PostgreSQL</text>
      <text x="14" y="62" class="tag">SQLite · Supabase</text>
      <text x="14" y="78" class="subtag">Aggregation Pipelines · Indexing</text>
    </g>

    <!-- 05 // AI & ML -->
    <g transform="translate(282, 0)">
      <rect x="0" y="0" width="260" height="92" rx="6" fill="#0d1117" stroke="#30363d" stroke-width="1.2" />
      <text x="14" y="20" class="cat-title">05 // AI &amp; MACHINE LEARNING</text>
      <text x="14" y="44" class="tag">PyTorch · Scikit-learn</text>
      <text x="14" y="62" class="tag">Pandas · NumPy · NLP · RAG</text>
      <text x="14" y="78" class="subtag">DNNs · LLM APIs · Time-Series</text>
    </g>

    <!-- 06 // Cloud & DevOps -->
    <g transform="translate(564, 0)">
      <rect x="0" y="0" width="260" height="92" rx="6" fill="#0d1117" stroke="#30363d" stroke-width="1.2" />
      <text x="14" y="20" class="cat-title">06 // CLOUD &amp; DEVOPS</text>
      <text x="14" y="44" class="tag">Microsoft Azure · AWS</text>
      <text x="14" y="62" class="tag">Git · GitHub · Docker · Postman</text>
      <text x="14" y="78" class="subtag">Vercel · Render · CI/CD Pipelines</text>
    </g>
  </g>
</svg>
