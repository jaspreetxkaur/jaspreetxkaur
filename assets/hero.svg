<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" width="100%" height="100%">
  <defs>
    <pattern id="dot-grid" x="0" y="0" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="3" cy="3" r="1.2" fill="#D3CBBB" />
    </pattern>
    <style>
      .mono { font-family: 'SF Mono', 'JetBrains Mono', 'Fira Code', Menlo, Consolas, monospace; }
      .sans { font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif; }
      .bold { font-weight: 900; }
      .medium { font-weight: 600; }
    </style>
  </defs>

  <!-- Neo-Brutalist Base Offset Shadow -->
  <rect x="8" y="8" width="884" height="404" rx="10" fill="#111111" />

  <!-- Main Container Card -->
  <rect x="0" y="0" width="884" height="404" rx="10" fill="#FAF6EE" stroke="#111111" stroke-width="3" />
  
  <!-- Dot Grid Pattern Fill (Body Area) -->
  <rect x="3" y="45" width="878" height="356" fill="url(#dot-grid)" opacity="0.65" rx="0" />

  <!-- Top Retro OS Window Header -->
  <path d="M 0 10 C 0 4.477 4.477 0 10 0 L 874 0 C 879.523 0 884 4.477 884 10 L 884 45 L 0 45 Z" fill="#FFE600" stroke="#111111" stroke-width="3" />
  
  <!-- Window Control Buttons -->
  <circle cx="26" cy="23" r="6" fill="#FF5E57" stroke="#111111" stroke-width="2" />
  <circle cx="44" cy="23" r="6" fill="#FEB024" stroke="#111111" stroke-width="2" />
  <circle cx="62" cy="23" r="6" fill="#28C840" stroke="#111111" stroke-width="2" />

  <!-- Window Title -->
  <text x="88" y="28" class="mono bold" font-size="12.5" fill="#111111" letter-spacing="1">JASPREET.exe [DEVELOPER_SESSION] — CHITKARA_UNIV://COHORT_2028</text>

  <!-- Right Header Badge -->
  <rect x="734" y="10" width="136" height="24" rx="4" fill="#111111" />
  <text x="802" y="26" class="mono bold" font-size="10.5" fill="#FFE600" text-anchor="middle" letter-spacing="1">CGPA: 9.21 // 2028</text>

  <!-- Navigation Bar Strip -->
  <g transform="translate(30, 64)">
    <rect x="0" y="0" width="824" height="32" rx="4" fill="#FFFFFF" stroke="#111111" stroke-width="2" />
    <text x="16" y="21" class="mono bold" font-size="11" fill="#111111" letter-spacing="1.5">NAV:</text>
    <text x="65" y="21" class="mono medium" font-size="11.5" fill="#0047FF" letter-spacing="2">/ABOUT</text>
    <text x="145" y="21" class="mono medium" font-size="11" fill="#111111">·</text>
    <text x="165" y="21" class="mono medium" font-size="11.5" fill="#0047FF" letter-spacing="2">/TECH</text>
    <text x="235" y="21" class="mono medium" font-size="11" fill="#111111">·</text>
    <text x="255" y="21" class="mono medium" font-size="11.5" fill="#0047FF" letter-spacing="2">/WORK</text>
    <text x="325" y="21" class="mono medium" font-size="11" fill="#111111">·</text>
    <text x="345" y="21" class="mono medium" font-size="11.5" fill="#0047FF" letter-spacing="2">/OPEN-SOURCE</text>
    <text x="470" y="21" class="mono medium" font-size="11" fill="#111111">·</text>
    <text x="490" y="21" class="mono medium" font-size="11.5" fill="#0047FF" letter-spacing="2">/LOGS</text>
    
    <!-- System Status Pill -->
    <g transform="translate(565, 5)">
      <rect x="0" y="0" width="245" height="22" rx="11" fill="#E8F9EE" stroke="#111111" stroke-width="1.5" />
      <circle cx="12" cy="11" r="4.5" fill="#10B981" stroke="#065F46" stroke-width="1" />
      <text x="24" y="15" class="mono bold" font-size="9.5" fill="#065F46" letter-spacing="0.8">SYSTEM STATUS: ALWAYS BUILDING</text>
    </g>
  </g>

  <!-- Left Hero Content Block -->
  <g transform="translate(40, 122)">
    <!-- Sub-tag identifier -->
    <g>
      <rect x="2" y="2" width="190" height="24" rx="3" fill="#111111" />
      <rect x="0" y="0" width="190" height="24" rx="3" fill="#FFAEC9" stroke="#111111" stroke-width="2" />
      <text x="95" y="16" class="mono bold" font-size="10" fill="#111111" text-anchor="middle" letter-spacing="1">⚡ FULL STACK + AI/ML</text>
    </g>

    <!-- Oversized Headline -->
    <!-- Line 1: FULL STACK -->
    <text x="0" y="76" class="sans bold" font-size="52" fill="#111111" letter-spacing="-1.5">FULL STACK</text>
    <!-- Line 2: Outlined DEVELOPER. -->
    <g transform="translate(0, 134)">
      <!-- Hard Shadow for Outline Text -->
      <text x="3" y="3" class="sans bold" font-size="52" fill="#0047FF" letter-spacing="-1.5">DEVELOPER.</text>
      <!-- Front Text -->
      <text x="0" y="0" class="sans bold" font-size="52" fill="#FAF6EE" stroke="#111111" stroke-width="3.5" letter-spacing="-1.5">DEVELOPER.</text>
    </g>

    <!-- Supporting Text Paragraph (Exact user statement) -->
    <rect x="0" y="156" width="480" height="50" rx="4" fill="#FFFFFF" stroke="#111111" stroke-width="1.5" />
    <text x="14" y="177" class="sans medium" font-size="13" fill="#111111">
      "I build intelligent applications, engineer backend systems,
    </text>
    <text x="14" y="196" class="sans bold" font-size="13" fill="#0047FF">
      and turn ideas into working software."
    </text>

    <!-- Bottom Cohort & Specialization Badges -->
    <g transform="translate(0, 222)">
      <!-- Badge 1 -->
      <rect x="2" y="2" width="145" height="26" rx="4" fill="#111111" />
      <rect x="0" y="0" width="145" height="26" rx="4" fill="#FFFFFF" stroke="#111111" stroke-width="2" />
      <text x="72" y="17" class="mono bold" font-size="9.5" fill="#111111" text-anchor="middle">✦ B.E. CSE (AI &amp; ML)</text>

      <!-- Badge 2 -->
      <g transform="translate(155, 0)">
        <rect x="2" y="2" width="160" height="26" rx="4" fill="#111111" />
        <rect x="0" y="0" width="160" height="26" rx="4" fill="#FFE600" stroke="#111111" stroke-width="2" />
        <text x="80" y="17" class="mono bold" font-size="9.5" fill="#111111" text-anchor="middle">★ CHITKARA '28 [9.21]</text>
      </g>

      <!-- Badge 3 -->
      <g transform="translate(325, 0)">
        <rect x="2" y="2" width="155" height="26" rx="4" fill="#111111" />
        <rect x="0" y="0" width="155" height="26" rx="4" fill="#0047FF" stroke="#111111" stroke-width="2" />
        <text x="77" y="17" class="mono bold" font-size="9.5" fill="#FFFFFF" text-anchor="middle">⚡ ACTIVE BUILDER</text>
      </g>
    </g>
  </g>

  <!-- Right Editorial Terminal Card -->
  <g transform="translate(545, 120)">
    <!-- Card Shadow -->
    <rect x="5" y="5" width="310" height="252" rx="6" fill="#111111" />
    <!-- Card Body -->
    <rect x="0" y="0" width="310" height="252" rx="6" fill="#FFFFFF" stroke="#111111" stroke-width="2.5" />
    
    <!-- Mini Terminal Titlebar -->
    <path d="M 0 6 C 0 2.686 2.686 0 6 0 L 304 0 C 307.314 0 310 2.686 310 6 L 310 32 L 0 32 Z" fill="#111111" />
    <text x="14" y="21" class="mono bold" font-size="11" fill="#FFE600" letter-spacing="1">&gt;_ SYS_DEV_TELEMETRY</text>
    <rect x="236" y="7" width="62" height="18" rx="3" fill="#FFE600" />
    <text x="267" y="20" class="mono bold" font-size="9" fill="#111111" text-anchor="middle">ONLINE</text>

    <!-- Terminal Content Lines -->
    <g transform="translate(14, 48)">
      <!-- Line 1 -->
      <text x="0" y="12" class="mono bold" font-size="10.5" fill="#0047FF">USER</text>
      <text x="80" y="12" class="mono bold" font-size="10.5" fill="#111111">: jaspreetxkaur</text>

      <line x1="0" y1="22" x2="282" y2="22" stroke="#E5E0D8" stroke-width="1" stroke-dasharray="2 2" />

      <!-- Line 2 -->
      <text x="0" y="38" class="mono bold" font-size="10.5" fill="#0047FF">ROLE</text>
      <text x="80" y="38" class="mono bold" font-size="10.5" fill="#111111">: CSE AI &amp; ML STUDENT</text>

      <line x1="0" y1="48" x2="282" y2="48" stroke="#E5E0D8" stroke-width="1" stroke-dasharray="2 2" />

      <!-- Line 3 -->
      <text x="0" y="64" class="mono bold" font-size="10.5" fill="#0047FF">FOCUS</text>
      <text x="80" y="64" class="mono bold" font-size="10.5" fill="#111111">: FULL STACK + AI</text>

      <line x1="0" y1="74" x2="282" y2="74" stroke="#E5E0D8" stroke-width="1" stroke-dasharray="2 2" />

      <!-- Line 4 -->
      <text x="0" y="90" class="mono bold" font-size="10.5" fill="#0047FF">COHORT</text>
      <text x="80" y="90" class="mono bold" font-size="10.5" fill="#111111">: 2028 (CGPA: 9.21)</text>

      <line x1="0" y1="100" x2="282" y2="100" stroke="#E5E0D8" stroke-width="1" stroke-dasharray="2 2" />

      <!-- Line 5 -->
      <text x="0" y="116" class="mono bold" font-size="10.5" fill="#0047FF">SYS</text>
      <text x="80" y="116" class="mono bold" font-size="10.5" fill="#111111">: Chitkara University</text>

      <line x1="0" y1="126" x2="282" y2="126" stroke="#E5E0D8" stroke-width="1" stroke-dasharray="2 2" />

      <!-- Line 6 -->
      <text x="0" y="142" class="mono bold" font-size="10.5" fill="#0047FF">STATUS</text>
      <text x="80" y="142" class="mono bold" font-size="10.5" fill="#10B981">: ALWAYS BUILDING ⚡</text>
    </g>

    <!-- Bottom Mini-Strip inside card -->
    <g transform="translate(14, 204)">
      <rect x="0" y="0" width="282" height="34" rx="4" fill="#FAF6EE" stroke="#111111" stroke-width="1.5" />
      <text x="12" y="21" class="mono bold" font-size="10" fill="#111111">&gt;&gt; git commit -m "building future"</text>
      <circle cx="266" cy="17" r="4" fill="#0047FF" />
    </g>
  </g>

  <!-- Bottom Accent Stripe Bar -->
  <g transform="translate(0, 396)">
    <rect x="3" y="0" width="878" height="5" fill="#0047FF" />
  </g>
</svg>
