<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 248" width="100%" height="100%">
  <defs>
    <linearGradient id="pink-area-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ff94c2" stop-opacity="0.45" />
      <stop offset="60%" stop-color="#d63384" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#161b22" stop-opacity="0.0" />
    </linearGradient>

    <linearGradient id="pink-line-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff94c2" />
      <stop offset="50%" stop-color="#ff1493" />
      <stop offset="100%" stop-color="#ff94c2" />
    </linearGradient>

    <style>
      .hdr-pill {
        font-family: 'SF Mono', 'JetBrains Mono', Menlo, Consolas, monospace;
        font-size: 11px;
        font-weight: 700;
        letter-spacing: 1.2px;
        fill: #f0f6fc;
      }
      .stat-pill {
        font-family: 'SF Mono', 'JetBrains Mono', Menlo, Consolas, monospace;
        font-size: 9.5px;
        font-weight: 600;
      }
      .axis-lbl {
        font-family: 'SF Mono', 'JetBrains Mono', Menlo, Consolas, monospace;
        font-size: 9.5px;
        fill: #6e7681;
      }
      @keyframes pink-pulse {
        0%, 100% { r: 7px; opacity: 0.35; }
        50% { r: 11px; opacity: 0.8; }
      }
      .pink-pulse {
        animation: pink-pulse 2.5s ease-in-out infinite;
      }
    </style>
  </defs>

  <!-- Container Box -->
  <rect x="0" y="0" width="880" height="248" rx="8" fill="#161b22" stroke="#30363d" stroke-width="1.5" />

  <!-- Title & Status Header -->
  <g transform="translate(28, 24)">
    <rect x="0" y="-12" width="225" height="24" rx="4" fill="#21262d" stroke="#30363d" stroke-width="1" />
    <text x="12" y="4" class="hdr-pill"><tspan fill="#ff94c2">✦ </tspan>DAILY ACTIVITY PULSE</text>
    
    <!-- Right Telemetry Chips -->
    <g transform="translate(454, -10)">
      <rect x="0" y="0" width="170" height="20" rx="3.5" fill="#21262d" />
      <text x="85" y="14" class="stat-pill" fill="#ff94c2" text-anchor="middle">🌙 NIGHT OWL (10PM - 2AM)</text>
      
      <rect x="180" y="0" width="180" height="20" rx="3.5" fill="#21262d" />
      <text x="270" y="14" class="stat-pill" fill="#39d353" text-anchor="middle">⚡ CONTINUOUS SHIP CYCLE</text>
    </g>
  </g>

  <!-- Grid Guidelines (Subtle) -->
  <g stroke="#21262d" stroke-dasharray="3,4" stroke-width="1">
    <line x1="45" y1="70" x2="825" y2="70" />
    <line x1="45" y1="110" x2="825" y2="110" />
    <line x1="45" y1="150" x2="825" y2="150" />
    <line x1="45" y1="195" x2="825" y2="195" stroke-dasharray="none" stroke="#30363d" />
  </g>

  <!-- Area Fill Gradient -->
  <path d="M 45 175 C 75.0 175, 75.0 150, 105 150 C 135.0 150, 135.0 105, 165 105 C 195.0 105, 195.0 130, 225 130 C 255.0 130, 255.0 58, 285 58 C 315.0 58, 315.0 95, 345 95 C 375.0 95, 375.0 140, 405 140 C 435.0 140, 435.0 68, 465 68 C 495.0 68, 495.0 90, 525 90 C 555.0 90, 555.0 52, 585 52 C 615.0 52, 615.0 115, 645 115 C 675.0 115, 675.0 82, 705 82 C 735.0 82, 735.0 62, 765 62 C 795.0 62, 795.0 75, 825 75 L 825 195 L 45 195 Z" fill="url(#pink-area-grad)" />

  <!-- Smooth Neon Pink Line -->
  <path d="M 45 175 C 75.0 175, 75.0 150, 105 150 C 135.0 150, 135.0 105, 165 105 C 195.0 105, 195.0 130, 225 130 C 255.0 130, 255.0 58, 285 58 C 315.0 58, 315.0 95, 345 95 C 375.0 95, 375.0 140, 405 140 C 435.0 140, 435.0 68, 465 68 C 495.0 68, 495.0 90, 525 90 C 555.0 90, 555.0 52, 585 52 C 615.0 52, 615.0 115, 645 115 C 675.0 115, 675.0 82, 705 82 C 735.0 82, 735.0 62, 765 62 C 795.0 62, 795.0 75, 825 75" fill="none" stroke="url(#pink-line-grad)" stroke-width="2.8" stroke-linecap="round" />

  <!-- Data Points -->
  
            <circle cx="45" cy="175" r="3" fill="#d63384" />
            
            <circle cx="105" cy="150" r="3" fill="#d63384" />
            
            <circle cx="165" cy="105" r="3" fill="#d63384" />
            
            <circle cx="225" cy="130" r="3" fill="#d63384" />
            
            <circle cx="285" cy="58" r="7" fill="#ff94c2" opacity="0.4" class="pink-pulse" />
            <circle cx="285" cy="58" r="4" fill="#ff1493" stroke="#ffffff" stroke-width="1.3" />
            
            <circle cx="345" cy="95" r="3" fill="#d63384" />
            
            <circle cx="405" cy="140" r="3" fill="#d63384" />
            
            <circle cx="465" cy="68" r="7" fill="#ff94c2" opacity="0.4" class="pink-pulse" />
            <circle cx="465" cy="68" r="4" fill="#ff1493" stroke="#ffffff" stroke-width="1.3" />
            
            <circle cx="525" cy="90" r="3" fill="#d63384" />
            
            <circle cx="585" cy="52" r="7" fill="#ff94c2" opacity="0.4" class="pink-pulse" />
            <circle cx="585" cy="52" r="4" fill="#ff1493" stroke="#ffffff" stroke-width="1.3" />
            
            <circle cx="645" cy="115" r="3" fill="#d63384" />
            
            <circle cx="705" cy="82" r="3" fill="#d63384" />
            
            <circle cx="765" cy="62" r="7" fill="#ff94c2" opacity="0.4" class="pink-pulse" />
            <circle cx="765" cy="62" r="4" fill="#ff1493" stroke="#ffffff" stroke-width="1.3" />
            
            <circle cx="825" cy="75" r="3" fill="#d63384" />
            

  <!-- Timeline Month Labels -->
  <g transform="translate(0, 213)">
    <text x="50" y="0" class="axis-lbl">WEEK 01</text>
    <text x="170" y="0" class="axis-lbl">WEEK 08</text>
    <text x="290" y="0" class="axis-lbl" fill="#ff94c2" font-weight="700">UniLLM 🚀</text>
    <text x="410" y="0" class="axis-lbl">WEEK 20</text>
    <text x="470" y="0" class="axis-lbl" fill="#00d2d3" font-weight="700">CareerForge ✨</text>
    <text x="590" y="0" class="axis-lbl" fill="#ff9f43" font-weight="700">BrimLine ⚡</text>
    <text x="710" y="0" class="axis-lbl">WEEK 40</text>
    <text x="810" y="0" class="axis-lbl" fill="#ff94c2" font-weight="700">NOW ★</text>
  </g>
</svg>
