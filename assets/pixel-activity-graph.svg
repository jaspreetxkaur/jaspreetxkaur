<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 330" width="100%" height="100%">
  <defs>
    <!-- Light Baby Pink Area Gradient -->
    <linearGradient id="light-pink-area" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFB3C6" stop-opacity="0.5" />
      <stop offset="50%" stop-color="#FFCCD5" stop-opacity="0.18" />
      <stop offset="100%" stop-color="#161b22" stop-opacity="0.0" />
    </linearGradient>

    <!-- Light Baby Pink Line Gradient -->
    <linearGradient id="light-pink-line" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFC2D1" />
      <stop offset="50%" stop-color="#FF8FAB" />
      <stop offset="100%" stop-color="#FFB3C6" />
    </linearGradient>

    <style>
      .hdr-pill {
        font-family: 'SF Mono', 'JetBrains Mono', Menlo, Consolas, monospace;
        font-size: 11.5px;
        font-weight: 700;
        letter-spacing: 1.2px;
        fill: #f0f6fc;
      }
      .stat-pill {
        font-family: 'SF Mono', 'JetBrains Mono', Menlo, Consolas, monospace;
        font-size: 10px;
        font-weight: 600;
      }
      .axis-lbl {
        font-family: 'SF Mono', 'JetBrains Mono', Menlo, Consolas, monospace;
        font-size: 10px;
        fill: #8b949e;
      }
      @keyframes baby-pink-glow {
        0%, 100% { r: 8px; opacity: 0.3; }
        50% { r: 13px; opacity: 0.75; }
      }
      .baby-pink-pulse {
        animation: baby-pink-glow 2.4s ease-in-out infinite;
      }
    </style>
  </defs>

  <!-- Container Box with Soft Border -->
  <rect x="0" y="0" width="880" height="330" rx="8" fill="#161b22" stroke="#30363d" stroke-width="1.5" />

  <!-- Title & Status Header -->
  <g transform="translate(28, 26)">
    <rect x="0" y="-12" width="235" height="26" rx="4.5" fill="#21262d" stroke="#30363d" stroke-width="1" />
    <text x="12" y="5" class="hdr-pill"><tspan fill="#FFB3C6">✦ </tspan>DAILY ACTIVITY PULSE</text>
    
    <!-- Right Telemetry Chips -->
    <g transform="translate(444, -10)">
      <rect x="0" y="0" width="175" height="22" rx="4" fill="#21262d" />
      <text x="87" y="15" class="stat-pill" fill="#FFB3C6" text-anchor="middle">🌙 NIGHT OWL (10PM - 2AM)</text>
      
      <rect x="185" y="0" width="190" height="22" rx="4" fill="#21262d" />
      <text x="280" y="15" class="stat-pill" fill="#39d353" text-anchor="middle">⚡ CONTINUOUS SHIP CYCLE</text>
    </g>
  </g>

  <!-- Subtle Horizontal Grid Lines -->
  <g stroke="#21262d" stroke-dasharray="3,4" stroke-width="1">
    <line x1="45" y1="90" x2="825" y2="90" />
    <line x1="45" y1="145" x2="825" y2="145" />
    <line x1="45" y1="205" x2="825" y2="205" />
    <line x1="45" y1="265" x2="825" y2="265" stroke-dasharray="none" stroke="#30363d" />
  </g>

  <!-- Luminous Area Fill Gradient (Light Pink) -->
  <path d="M 45 235 C 75.0 235, 75.0 205, 105 205 C 135.0 205, 135.0 140, 165 140 C 195.0 140, 195.0 175, 225 175 C 255.0 175, 255.0 75, 285 75 C 315.0 75, 315.0 130, 345 130 C 375.0 130, 375.0 190, 405 190 C 435.0 190, 435.0 90, 465 90 C 495.0 90, 495.0 120, 525 120 C 555.0 120, 555.0 68, 585 68 C 615.0 68, 615.0 155, 645 155 C 675.0 155, 675.0 110, 705 110 C 735.0 110, 735.0 82, 765 82 C 795.0 82, 795.0 98, 825 98 L 825 265 L 45 265 Z" fill="url(#light-pink-area)" />

  <!-- Smooth Light Baby Pink Line -->
  <path d="M 45 235 C 75.0 235, 75.0 205, 105 205 C 135.0 205, 135.0 140, 165 140 C 195.0 140, 195.0 175, 225 175 C 255.0 175, 255.0 75, 285 75 C 315.0 75, 315.0 130, 345 130 C 375.0 130, 375.0 190, 405 190 C 435.0 190, 435.0 90, 465 90 C 495.0 90, 495.0 120, 525 120 C 555.0 120, 555.0 68, 585 68 C 615.0 68, 615.0 155, 645 155 C 675.0 155, 675.0 110, 705 110 C 735.0 110, 735.0 82, 765 82 C 795.0 82, 795.0 98, 825 98" fill="none" stroke="url(#light-pink-line)" stroke-width="3" stroke-linecap="round" />

  <!-- Data Points -->
  
            <circle cx="45" cy="235" r="3.5" fill="#FFB3C6" />
            
            <circle cx="105" cy="205" r="3.5" fill="#FFB3C6" />
            
            <circle cx="165" cy="140" r="3.5" fill="#FFB3C6" />
            
            <circle cx="225" cy="175" r="3.5" fill="#FFB3C6" />
            
            <circle cx="285" cy="75" r="9" fill="#FFC2D1" opacity="0.35" class="baby-pink-pulse" />
            <circle cx="285" cy="75" r="5" fill="#FF8FAB" stroke="#FFF0F5" stroke-width="1.8" />
            
            <circle cx="345" cy="130" r="3.5" fill="#FFB3C6" />
            
            <circle cx="405" cy="190" r="3.5" fill="#FFB3C6" />
            
            <circle cx="465" cy="90" r="9" fill="#FFC2D1" opacity="0.35" class="baby-pink-pulse" />
            <circle cx="465" cy="90" r="5" fill="#FF8FAB" stroke="#FFF0F5" stroke-width="1.8" />
            
            <circle cx="525" cy="120" r="3.5" fill="#FFB3C6" />
            
            <circle cx="585" cy="68" r="9" fill="#FFC2D1" opacity="0.35" class="baby-pink-pulse" />
            <circle cx="585" cy="68" r="5" fill="#FF8FAB" stroke="#FFF0F5" stroke-width="1.8" />
            
            <circle cx="645" cy="155" r="3.5" fill="#FFB3C6" />
            
            <circle cx="705" cy="110" r="3.5" fill="#FFB3C6" />
            
            <circle cx="765" cy="82" r="9" fill="#FFC2D1" opacity="0.35" class="baby-pink-pulse" />
            <circle cx="765" cy="82" r="5" fill="#FF8FAB" stroke="#FFF0F5" stroke-width="1.8" />
            
            <circle cx="825" cy="98" r="3.5" fill="#FFB3C6" />
            

  <!-- Timeline Month Labels -->
  <g transform="translate(0, 289)">
    <text x="50" y="0" class="axis-lbl">WEEK 01</text>
    <text x="170" y="0" class="axis-lbl">WEEK 08</text>
    <text x="290" y="0" class="axis-lbl" fill="#FFB3C6" font-weight="700">UniLLM 🚀</text>
    <text x="410" y="0" class="axis-lbl">WEEK 20</text>
    <text x="470" y="0" class="axis-lbl" fill="#00d2d3" font-weight="700">CareerForge ✨</text>
    <text x="590" y="0" class="axis-lbl" fill="#ff9f43" font-weight="700">BrimLine ⚡</text>
    <text x="710" y="0" class="axis-lbl">WEEK 40</text>
    <text x="810" y="0" class="axis-lbl" fill="#FFB3C6" font-weight="700">NOW ★</text>
  </g>
</svg>
