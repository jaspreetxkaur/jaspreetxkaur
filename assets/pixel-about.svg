<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 148" width="100%" height="100%">
  <defs>
    <style>
      .terminal-header {
        font-family: 'Press Start 2P', 'Courier New', 'SF Mono', monospace;
        font-size: 13px;
        font-weight: bold;
        fill: #39d353;
        letter-spacing: 1.5px;
      }
      .name {
        font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        font-size: 26px;
        font-weight: 800;
        fill: #ffffff;
        letter-spacing: -0.5px;
      }
      .sub {
        font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        font-size: 13.5px;
        font-weight: 500;
        fill: #c9d1d9;
      }
      .meta {
        font-family: 'SF Mono', 'JetBrains Mono', Menlo, Consolas, monospace;
        font-size: 11px;
        fill: #8b949e;
      }
    </style>
  </defs>

  <!-- Container Box -->
  <rect x="0" y="0" width="880" height="148" rx="8" fill="#161b22" stroke="#30363d" stroke-width="1.5" />

  <!-- Left Content -->
  <g transform="translate(32, 24)">
    <!-- Terminal Header: > ABOUT -->
    <text x="0" y="14" class="terminal-header">&gt; ABOUT</text>
    
    <!-- Name -->
    <text x="0" y="46" class="name">Jaspreet Kaur</text>
    
    <!-- Bio / Role -->
    <text x="0" y="72" class="sub">B.E. CSE (AI &amp; ML) '28 @ Chitkara • Full-Stack Dev • 128+ DSA Solved • Always Building</text>
    
    <!-- Metadata -->
    <g transform="translate(0, 96)">
      <text x="0" y="0" class="meta">📍 Rajpura, Punjab  ·  🎓 Chitkara University  ·  💻 CSE (AI &amp; ML)  ·  ⚡ Class of 2028</text>
    </g>
  </g>

  <!-- Right: Pixel Avatar Box -->
  <g transform="translate(740, 20)">
    <!-- Frame Drop Shadow -->
    <rect x="3" y="3" width="108" height="108" rx="4" fill="#0c1017" />
    <!-- White Pixel Frame Border -->
    <rect x="0" y="0" width="108" height="108" rx="4" fill="#ffffff" stroke="#30363d" stroke-width="2" />
    <image href="data:image/png;base64," x="4" y="4" width="100" height="100" preserveAspectRatio="xMidYMid slice" />
  </g>
</svg>
