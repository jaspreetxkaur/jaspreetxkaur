<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 136" width="100%" height="100%">
  <defs>
    <style>
      .mono { font-family: 'SF Mono', 'JetBrains Mono', 'Fira Code', Menlo, Consolas, monospace; }
      .sans { font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif; }
      .bold { font-weight: 800; }
      .heavy { font-weight: 900; }
    </style>
  </defs>

  <!-- Offset Shadow -->
  <rect x="5" y="5" width="870" height="126" rx="6" fill="#111111" />
  <!-- Main Card -->
  <rect x="0" y="0" width="870" height="126" rx="6" fill="#FAF6EE" stroke="#111111" stroke-width="2.5" />

  <!-- Titlebar -->
  <path d="M 0 6 C 0 2.686 2.686 0 6 0 L 864 0 C 867.314 0 870 2.686 870 6 L 870 34 L 0 34 Z" fill="#111111" />
  <text x="16" y="22" class="mono bold" font-size="11" fill="#FFE600" letter-spacing="1">SYSTEM://PRJ-01 // MULTI-TENANT INFERENCE ROUTER</text>
  
  <!-- Status Badge -->
  <g transform="translate(645, 7)">
    <rect x="0" y="0" width="215" height="20" rx="3" fill="#FFE600" stroke="#111111" stroke-width="1.2" />
    <text x="107.5" y="14" class="mono bold" font-size="9" fill="#111111" text-anchor="middle" letter-spacing="0.8">CORE ARCHITECTURE // COMPLETE</text>
  </g>

  <!-- Project Name & Description -->
  <g transform="translate(20, 56)">
    <text x="0" y="16" class="sans heavy" font-size="20" fill="#111111" letter-spacing="-0.5">UniLLM — Unified AI Gateway</text>
    <text x="0" y="38" class="sans" font-size="12.5" fill="#444444">Multi-tenant AI gateway routing requests across OpenAI, Gemini &amp; Anthropic through an OpenAI-compatible API.</text>

    <!-- Stack Tags -->
    <g transform="translate(0, 50)">
      
        <g transform="translate(0, 0)">
          <rect x="0" y="0" width="72.5" height="24" rx="3" fill="#FFFFFF" stroke="#111111" stroke-width="1.3" />
          <text x="36.25" y="16" class="mono bold" font-size="10" fill="#111111" text-anchor="middle">Node.js</text>
        </g>
        
        <g transform="translate(80.5, 0)">
          <rect x="0" y="0" width="95.0" height="24" rx="3" fill="#FFFFFF" stroke="#111111" stroke-width="1.3" />
          <text x="47.5" y="16" class="mono bold" font-size="10" fill="#111111" text-anchor="middle">Express.js</text>
        </g>
        
        <g transform="translate(183.5, 0)">
          <rect x="0" y="0" width="72.5" height="24" rx="3" fill="#FFFFFF" stroke="#111111" stroke-width="1.3" />
          <text x="36.25" y="16" class="mono bold" font-size="10" fill="#111111" text-anchor="middle">MongoDB</text>
        </g>
        
        <g transform="translate(264.0, 0)">
          <rect x="0" y="0" width="87.5" height="24" rx="3" fill="#FFFFFF" stroke="#111111" stroke-width="1.3" />
          <text x="43.75" y="16" class="mono bold" font-size="10" fill="#111111" text-anchor="middle">Socket.IO</text>
        </g>
        
        <g transform="translate(359.5, 0)">
          <rect x="0" y="0" width="42.5" height="24" rx="3" fill="#FFFFFF" stroke="#111111" stroke-width="1.3" />
          <text x="21.25" y="16" class="mono bold" font-size="10" fill="#111111" text-anchor="middle">JWT</text>
        </g>
        
    </g>
  </g>

  
</svg>
