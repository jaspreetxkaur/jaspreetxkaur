<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 130" width="100%" height="100%">
  <defs>
    <style>
      .mono { font-family: 'SF Mono', 'JetBrains Mono', 'Fira Code', Menlo, Consolas, monospace; }
      .sans { font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif; }
      .bold { font-weight: 800; }
    </style>
  </defs>

  <!-- Base container -->
  <rect x="0" y="0" width="900" height="130" rx="8" fill="#F4EFEA" stroke="#111111" stroke-width="2.5" />

  <!-- Title bar strip -->
  <g transform="translate(16, 12)">
    <text x="0" y="14" class="mono bold" font-size="11" fill="#111111" letter-spacing="1.5">★ VERIFIED CREDENTIALS // RELEVANT TECHNICAL CERTIFICATIONS</text>
  </g>

  <!-- 3 Cert Cards -->
  <!-- Card 1: Oracle OCI Data Science -->
  <g transform="translate(16, 36)">
    <rect x="4" y="4" width="272" height="78" rx="6" fill="#111111" />
    <rect x="0" y="0" width="272" height="78" rx="6" fill="#FFFFFF" stroke="#111111" stroke-width="2" />
    
    <rect x="0" y="0" width="272" height="22" rx="6" fill="#FF5E57" />
    <rect x="0" y="16" width="272" height="6" fill="#FF5E57" />
    <text x="10" y="15" class="mono bold" font-size="9.5" fill="#FFFFFF">ORACLE CLOUD INFRASTRUCTURE</text>
    <text x="262" y="15" class="mono bold" font-size="9" fill="#FFFFFF" text-anchor="end">OCI</text>

    <text x="10" y="42" class="sans bold" font-size="12" fill="#111111">Data Science Professional</text>
    <text x="10" y="62" class="mono" font-size="9.5" fill="#666666">Certified Specialist · Cloud &amp; ML</text>
    <circle cx="254" cy="55" r="8" fill="#FAF6EE" stroke="#111111" stroke-width="1.5" />
    <text x="254" y="59" class="mono bold" font-size="10" fill="#111111" text-anchor="middle">✓</text>
  </g>

  <!-- Card 2: Azure AZ-900 -->
  <g transform="translate(304, 36)">
    <rect x="4" y="4" width="272" height="78" rx="6" fill="#111111" />
    <rect x="0" y="0" width="272" height="78" rx="6" fill="#FFFFFF" stroke="#111111" stroke-width="2" />
    
    <rect x="0" y="0" width="272" height="22" rx="6" fill="#0047FF" />
    <rect x="0" y="16" width="272" height="6" fill="#0047FF" />
    <text x="10" y="15" class="mono bold" font-size="9.5" fill="#FFFFFF">MICROSOFT CERTIFIED</text>
    <text x="262" y="15" class="mono bold" font-size="9" fill="#FFFFFF" text-anchor="end">AZ-900</text>

    <text x="10" y="42" class="sans bold" font-size="12" fill="#111111">Azure Fundamentals</text>
    <text x="10" y="62" class="mono" font-size="9.5" fill="#666666">Cloud Concepts &amp; Architecture</text>
    <circle cx="254" cy="55" r="8" fill="#FAF6EE" stroke="#111111" stroke-width="1.5" />
    <text x="254" y="59" class="mono bold" font-size="10" fill="#0047FF" text-anchor="middle">✓</text>
  </g>

  <!-- Card 3: Azure DP-900 -->
  <g transform="translate(592, 36)">
    <rect x="4" y="4" width="292" height="78" rx="6" fill="#111111" />
    <rect x="0" y="0" width="292" height="78" rx="6" fill="#FFFFFF" stroke="#111111" stroke-width="2" />
    
    <rect x="0" y="0" width="292" height="22" rx="6" fill="#10B981" />
    <rect x="0" y="16" width="292" height="6" fill="#10B981" />
    <text x="10" y="15" class="mono bold" font-size="9.5" fill="#FFFFFF">MICROSOFT CERTIFIED</text>
    <text x="282" y="15" class="mono bold" font-size="9" fill="#FFFFFF" text-anchor="end">DP-900</text>

    <text x="10" y="42" class="sans bold" font-size="12" fill="#111111">Azure Data Fundamentals</text>
    <text x="10" y="62" class="mono" font-size="9.5" fill="#666666">Core Data &amp; Analytics Workloads</text>
    <circle cx="274" cy="55" r="8" fill="#FAF6EE" stroke="#111111" stroke-width="1.5" />
    <text x="274" y="59" class="mono bold" font-size="10" fill="#065F46" text-anchor="middle">✓</text>
  </g>
</svg>
