<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 320" width="100%" height="100%">
  <defs>
    <style>
      .mono { font-family: 'SF Mono', 'JetBrains Mono', 'Fira Code', Menlo, Consolas, monospace; }
      .sans { font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif; }
      .bold { font-weight: 800; }
      .medium { font-weight: 600; }
    </style>
  </defs>

  <!-- Canvas Container Base -->
  <rect x="0" y="0" width="900" height="320" rx="8" fill="#F4EFEA" stroke="#111111" stroke-width="2.5" />

  <!-- ================= LEFT: CURRENTLY EXPLORING ================= -->
  <g transform="translate(20, 20)">
    <!-- Shadow -->
    <rect x="5" y="5" width="418" height="278" rx="6" fill="#111111" />
    <!-- Main Card -->
    <rect x="0" y="0" width="418" height="278" rx="6" fill="#FFFFFF" stroke="#111111" stroke-width="2.5" />

    <!-- Card Titlebar -->
    <path d="M 0 6 C 0 2.686 2.686 0 6 0 L 412 0 C 415.314 0 418 2.686 418 6 L 418 36 L 0 36 Z" fill="#FFE600" stroke="#111111" stroke-width="2" />
    <text x="14" y="24" class="mono bold" font-size="12" fill="#111111" letter-spacing="1">⚡ /CURRENTLY-EXPLORING</text>
    <rect x="330" y="8" width="76" height="20" rx="3" fill="#111111" />
    <text x="368" y="22" class="mono bold" font-size="9.5" fill="#FFE600" text-anchor="middle">ACTIVE LAB</text>

    <!-- Exploration Items -->
    <g transform="translate(16, 52)">
      <!-- Item 1 -->
      <g>
        <rect x="0" y="0" width="78" height="20" rx="3" fill="#EBF3FF" stroke="#0047FF" stroke-width="1.2" />
        <text x="39" y="14" class="mono bold" font-size="9" fill="#0047FF" text-anchor="middle">ALGORITHMS</text>
        <text x="88" y="15" class="sans bold" font-size="12" fill="#111111">DSA in Java &amp; C++</text>
        <text x="88" y="32" class="mono" font-size="10" fill="#666666">Trees, Graphs, Recursion &amp; Dynamic Programming</text>
      </g>

      <line x1="0" y1="42" x2="386" y2="42" stroke="#E5E0D8" stroke-width="1" />

      <!-- Item 2 -->
      <g transform="translate(0, 52)">
        <rect x="0" y="0" width="78" height="20" rx="3" fill="#E8F9EE" stroke="#10B981" stroke-width="1.2" />
        <text x="39" y="14" class="mono bold" font-size="9" fill="#065F46" text-anchor="middle">BACKEND</text>
        <text x="88" y="15" class="sans bold" font-size="12" fill="#111111">Backend Architecture &amp; System Design</text>
        <text x="88" y="32" class="mono" font-size="10" fill="#666666">API gateways, state management, caching &amp; telemetry</text>
      </g>

      <line x1="0" y1="94" x2="386" y2="94" stroke="#E5E0D8" stroke-width="1" />

      <!-- Item 3 -->
      <g transform="translate(0, 104)">
        <rect x="0" y="0" width="78" height="20" rx="3" fill="#FFF0F5" stroke="#FF5E97" stroke-width="1.2" />
        <text x="39" y="14" class="mono bold" font-size="9" fill="#C2185B" text-anchor="middle">AI SYSTEMS</text>
        <text x="88" y="15" class="sans bold" font-size="12" fill="#111111">LLM Infra &amp; RAG Systems</text>
        <text x="88" y="32" class="mono" font-size="10" fill="#666666">Vector retrieval, KV-cache dynamics &amp; latency profiling</text>
      </g>

      <line x1="0" y1="146" x2="386" y2="146" stroke="#E5E0D8" stroke-width="1" />

