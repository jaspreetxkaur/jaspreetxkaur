      <g transform="translate(0, 156)">
        <rect x="0" y="0" width="78" height="20" rx="3" fill="#FFFBEB" stroke="#F59E0B" stroke-width="1.2" />
        <text x="39" y="14" class="mono bold" font-size="9" fill="#B45309" text-anchor="middle">DEEP LEARN</text>
        <text x="88" y="15" class="sans bold" font-size="12" fill="#111111">Deep Learning &amp; Model Optimization</text>
        <text x="88" y="32" class="mono" font-size="10" fill="#666666">PyTorch models, loss landscapes &amp; tabular regressors</text>
