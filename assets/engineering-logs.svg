        <text x="52" y="16" class="mono bold" font-size="9.5" fill="#111111" text-anchor="middle">Arrays &amp; Strings</text>

        <!-- Tag 2 -->
        <g transform="translate(112, 0)">
          <rect x="0" y="0" width="112" height="24" rx="3" fill="#FAF6EE" stroke="#111111" stroke-width="1.2" />
          <text x="56" y="16" class="mono bold" font-size="9.5" fill="#111111" text-anchor="middle">Trees &amp; BSTs</text>
        </g>

        <!-- Tag 3 -->
        <g transform="translate(232, 0)">
          <rect x="0" y="0" width="154" height="24" rx="3" fill="#FAF6EE" stroke="#111111" stroke-width="1.2" />
          <text x="77" y="16" class="mono bold" font-size="9.5" fill="#111111" text-anchor="middle">Dynamic Programming</text>
        </g>
      </g>

      <g transform="translate(0, 50)">
        <!-- Tag 4 -->
        <rect x="0" y="0" width="124" height="24" rx="3" fill="#FAF6EE" stroke="#111111" stroke-width="1.2" />
        <text x="62" y="16" class="mono bold" font-size="9.5" fill="#111111" text-anchor="middle">Graphs &amp; Traversal</text>

        <!-- Tag 5 -->
        <g transform="translate(132, 0)">
          <rect x="0" y="0" width="120" height="24" rx="3" fill="#FAF6EE" stroke="#111111" stroke-width="1.2" />
          <text x="60" y="16" class="mono bold" font-size="9.5" fill="#111111" text-anchor="middle">Binary Search &amp; 2P</text>
        </g>

        <!-- Tag 6 -->
        <g transform="translate(260, 0)">
